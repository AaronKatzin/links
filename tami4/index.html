<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#131210">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'">
    <title>Tami4</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png">
</head>
<body>
    <main>
        <h1>Tami4</h1>
        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

        <section aria-labelledby="status-heading">
            <h2 id="status-heading">Status</h2>
            <div id="status" class="panel" role="status">Loading status…</div>
            <p class="hint">Times are Asia/Jerusalem.</p>
        </section>

        <section aria-labelledby="pour-heading">
            <h2 id="pour-heading">Pour</h2>
            <button type="button" id="boil" class="primary" disabled>Boil</button>
            <div id="drinks" class="stack"></div>
            <p id="action-result" class="result" role="status" aria-live="polite"></p>
        </section>

        <section aria-labelledby="settings-heading">
            <h2 id="settings-heading">Settings</h2>
            <form id="settings-form" autocomplete="off">
                <div class="rows">
                    <label class="row"><span>Light</span><input type="checkbox" name="lightning" disabled></label>
                    <label class="row"><span>Child lock</span><input type="checkbox" name="childLock" disabled></label>
                    <label class="row"><span>Night mode</span><input type="checkbox" name="nightMode" disabled></label>
                    <label class="row"><span>Energy save</span><input type="checkbox" name="energySaveMode" disabled></label>
                    <label class="row"><span>Smart heating</span><input type="checkbox" name="smartHeatingMode" disabled></label>
                    <label class="row"><span>Button sounds</span><input type="checkbox" name="buttonsSound" disabled></label>
                    <label class="row"><span>Push and drink</span><input type="checkbox" name="pushAndDrink" disabled></label>
                    <label class="field">
                        <span>Boiling temperature (70–100, range is a guess)</span>
                        <input type="number" name="boilingTemp" min="70" max="100" step="1" inputmode="numeric" disabled>
                    </label>
                    <label class="field">
                        <span>Language (raw value)</span>
                        <input type="number" name="languageSetting" step="1" inputmode="numeric" disabled>
                        <span class="hint">The value is a raw device code.</span>
                    </label>
                </div>
                <p class="subhead">Read only</p>
                <div class="rows readonly">
                    <label class="row"><span>Connectivity</span><input type="checkbox" name="connectivityEnabled" disabled></label>
                    <label class="field"><span>Wi-Fi name</span><input type="text" name="wifiName" disabled spellcheck="false"></label>
                </div>
                <button type="submit" id="save" class="primary" disabled>Save</button>
            </form>
            <p id="settings-result" class="result" role="status" aria-live="polite"></p>
        </section>
        <noscript><p>This page needs JavaScript.</p></noscript>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
